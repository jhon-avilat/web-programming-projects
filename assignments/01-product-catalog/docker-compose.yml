# Fixed project name: containers and the DB volume are always called progweb-*,
# no matter which folder the compose file is started from.
name: progweb

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  page1:
    build: ./page1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ProgramacionWebPage1
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

  page2:
    build: ./page2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ProgramacionWebPage2
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"

  # Nginx gateway: single entry point on port 80 (/page1/ and /page2/). See gateway/nginx.conf
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - page1
      - page2
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    ports:
      - "80:80"

volumes:
  pgdata:
