spring.application.name=ProgramacionWebPage2
server.port=${SERVER_PORT:8081}

# Database connection. Values come from environment variables so no real
# password is stored in the repo. The defaults are only for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ProgramacionWebPage2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Printing every SQL query is useful while debugging, but noisy on the server.
# Turn it on with SHOW_SQL=true when you need it.
spring.jpa.show-sql=${SHOW_SQL:false}
