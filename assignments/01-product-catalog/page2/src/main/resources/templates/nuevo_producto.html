<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Add Product</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <h1>Add Product</h1>
            <hr>
            <h2>Product Data</h2>
            <form action="#" th:action="@{/grabarProducto}" th:object="${producto}" method="POST">
                <input type="text" th:field="*{codigo}" placeholder="Code" class="form-control mb-4 col-4">
                <input type="text" th:field="*{nomProducto}" placeholder="Product name" class="form-control mb-4 col-4">
                <input type="text" th:field="*{descripcion}" placeholder="Description" class="form-control mb-4 col-4">
                <input type="number" step="0.01" min="0" th:field="*{precio}" placeholder="Price" class="form-control mb-4 col-4">
                <input type="number" min="0" th:field="*{stock}" placeholder="Stock" class="form-control mb-4 col-4">
                <input type="date" th:field="*{fechIngreso}" class="form-control mb-4 col-4">
                <button type="submit" class="btn btn-info col-2">Save</button>
            </form>
            <hr>
            <a th:href="@{/listarProductos}">Back to product list</a>
        </div>
    </body>
</html>
