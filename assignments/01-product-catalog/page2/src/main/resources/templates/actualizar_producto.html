<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Product Management</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <h1>Update Product</h1>
            <hr>
            <h2>Product Data</h2>
            <form action="#" th:action="@{/grabarProducto}" th:object="${producto}" method="POST">
                <input type="hidden" th:field="*{numProducto}" />
                <div class="mb-4">
                    <input th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'" type="text" th:field="*{codigo}" class="form-control col-4">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                </div>
                <div class="mb-4">
                    <input th:classappend="${#fields.hasErrors('nomProducto')} ? 'is-invalid'" type="text" th:field="*{nomProducto}" class="form-control col-4">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nomProducto')}" th:errors="*{nomProducto}"></div>
                </div>
                <div class="mb-4">
                    <input th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'" type="text" th:field="*{descripcion}" class="form-control col-4">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                </div>
                <div class="mb-4">
                    <input th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" type="number" step="0.01" min="0" th:field="*{precio}" class="form-control col-4">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                </div>
                <div class="mb-4">
                    <input th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" type="number" min="0" th:field="*{stock}" class="form-control col-4">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>
                <div class="mb-4">
                    <input th:classappend="${#fields.hasErrors('fechIngreso')} ? 'is-invalid'" type="date" th:field="*{fechIngreso}" class="form-control col-4">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechIngreso')}" th:errors="*{fechIngreso}"></div>
                </div>
                <button type="submit" class="btn btn-info col-2">Update</button>
            </form>
            <hr>
            <a th:href="@{/listarProductos}">Back to product list</a>
        </div>
    </body>
</html>
