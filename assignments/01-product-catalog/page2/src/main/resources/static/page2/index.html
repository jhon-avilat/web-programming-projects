<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rick and Morty · Characters</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>tailwind.config = { prefix: 'tw-', corePlugins: { preflight: false } };</script>
  <link href="css/styles.css" rel="stylesheet">
  <script>
    // Apply the saved theme before the page is drawn (avoids a white flash in dark mode)
    (function () {
      var t = null;
      try { t = localStorage.getItem("page2-theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
</head>
<body>
  <nav class="navbar bg-body border-bottom sticky-top">
    <div class="container header-flex">
      <div class="d-flex align-items-center gap-3">
        <a href="../" class="btn btn-outline-secondary btn-sm">Back to menu</a>
        <span class="brand">Rick and Morty</span>
        <button id="themeToggle" type="button" class="btn btn-outline-secondary btn-sm" aria-label="Switch dark / light theme">🌙</button>
      </div>
      <div class="search-wrap">
        <input id="search" type="search" class="form-control" placeholder="Search character by name (results in 4 s)" autocomplete="off" aria-label="Search characters">
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="toolbar">
      <ul class="nav nav-pills" role="tablist">
        <li class="nav-item" role="presentation">
          <button id="tabAll" class="nav-link active" type="button" role="tab" aria-selected="true">All characters</button>
        </li>
        <li class="nav-item" role="presentation">
          <button id="tabFav" class="nav-link" type="button" role="tab" aria-selected="false">♥ Favorites <span id="favCount" class="badge text-bg-light">0</span></button>
        </li>
      </ul>
      <label class="status-filter">
        <span class="tw-text-sm">Status</span>
        <select id="statusFilter" class="form-select form-select-sm" aria-label="Filter by status">
          <option value="">All</option>
          <option value="alive">Alive</option>
          <option value="dead">Dead</option>
          <option value="unknown">Unknown</option>
        </select>
      </label>
    </div>
    <p id="status" class="tw-text-sm tw-text-slate-600 tw-mb-3" aria-live="polite"></p>
    <section id="grid" class="characters-grid" aria-label="Characters"></section>
    <div id="pager" class="tw-flex tw-items-center tw-justify-center tw-gap-3 tw-mt-4">
      <button id="prev" class="btn btn-outline-secondary btn-sm" disabled>Previous</button>
      <span id="pageInfo" class="tw-text-sm tw-text-slate-600"></span>
      <button id="next" class="btn btn-outline-secondary btn-sm" disabled>Next</button>
    </div>
  </main>

  <!-- Overlay window (Bootstrap modal) with the full character details -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-4" id="modalTitle"></h2>
          <button type="button" id="modalFav" class="btn btn-outline-danger btn-sm ms-auto me-2" aria-pressed="false">♡ Add to favorites</button>
          <button type="button" class="btn-close ms-0" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
