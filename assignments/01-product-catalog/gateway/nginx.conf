# API gateway for assignment 01.
# One public entry point (port 80) that routes each path to the right container:
#   /        -> small landing page (gateway/html/index.html)
#   /page1/  -> page1:8080  (product CRUD, catalog, /api/productos)
#   /page2/  -> page2:8081  (Rick and Morty page, /api/characters, /api/favorites)
# It's the same idea as AWS API Gateway, but it runs inside Docker for free.

# Docker's internal DNS, so Nginx can find "page1" / "page2" even if they start later
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Don't tell the world which Nginx version we run
    server_tokens off;

    # Basic security headers for every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Health check for the gateway itself
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /page1 without the final slash -> /page1/
    location = /page1 { return 301 /page1/; }
    location = /page2 { return 301 /page2/; }

    location /page1/ {
        set $page1 http://page1:8080;
        # Remove the /page1 prefix before passing the request to the app
        rewrite ^/page1/(.*)$ /$1 break;
        proxy_pass $page1;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Prefix /page1;
    }

    location /page2/ {
        set $page2 http://page2:8081;
        rewrite ^/page2/(.*)$ /$1 break;
        proxy_pass $page2;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Prefix /page2;
    }
}
