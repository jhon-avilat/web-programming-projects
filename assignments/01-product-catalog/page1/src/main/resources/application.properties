spring.application.name=ProgramacionWebPage1
server.port=${SERVER_PORT:8080}

# Database connection. Values come from environment variables so no real
# password is stored in the repo. The defaults are only for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ProgramacionWebPage1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Printing every SQL query is useful while debugging, but noisy on the server.
# Turn it on with SHOW_SQL=true when you need it.
spring.jpa.show-sql=${SHOW_SQL:false}

# Behind the Nginx gateway the app is served under /page1 or /page2. With "framework",
# Spring reads the X-Forwarded-Prefix header that Nginx sends, so Thymeleaf links (@{/...})
# and redirects include the prefix. Without the gateway nothing changes.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
