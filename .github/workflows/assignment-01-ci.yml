# CI for assignment 01 (Page 1 + Page 2).
# It only runs when something inside assignments/01-product-catalog changes,
# so future assignments in this monorepo get their own workflow and don't slow each other down.
name: "Assignment 01 · CI"

on:
  pull_request:
    paths:
      - "assignments/01-product-catalog/**"
      - ".github/workflows/assignment-01-ci.yml"
  push:
    branches: [main]
    paths:
      - "assignments/01-product-catalog/**"
      - ".github/workflows/assignment-01-ci.yml"
  workflow_dispatch:

# If I push again to the same branch, cancel the old run instead of running both
concurrency:
  group: assignment-01-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "Build & test (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [page1, page2]
    defaults:
      run:
        working-directory: assignments/01-product-catalog/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: assignments/01-product-catalog/${{ matrix.app }}/pom.xml

      - name: Run tests and build the JAR
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Upload test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.app }}
          path: assignments/01-product-catalog/${{ matrix.app }}/target/surefire-reports/

  docker:
    name: "Docker image builds (${{ matrix.app }})"
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [page1, page2]
    steps:
      - uses: actions/checkout@v4

      # Same Dockerfile the EC2 server uses, so a broken image is caught here and not on the server
      - name: Build the image (not pushed anywhere)
        run: docker build -t progweb-${{ matrix.app }}:ci assignments/01-product-catalog/${{ matrix.app }}

  smoke:
    name: "Full stack smoke test (gateway + apps + DB)"
    needs: docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignments/01-product-catalog
    env:
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4

      # Starts exactly what runs on EC2: db + page1 + page2 + gateway
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait until both apps answer through the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost/page1/api/productos >/dev/null && curl -fs http://localhost/page2/api/favorites >/dev/null; then
              echo "Both apps are up"; exit 0
            fi
            sleep 3
          done
          echo "Apps did not start in time"; exit 1

      - name: Check the routes
        run: |
          set -e
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          check http://localhost/health 200
          check http://localhost/ 200
          check http://localhost/page1/ 200
          check http://localhost/page1/catalogo/index.html 200
          check http://localhost/page1/api/productos 200
          check http://localhost/page1/api/productos/999999 404
          check http://localhost/page2/page2/index.html 200
          check http://localhost/page2/api/favorites 200
          # Thymeleaf links must include the /page1 prefix (X-Forwarded-Prefix works)
          curl -s http://localhost/page1/ | grep -q 'href="/page1/listarProductos"'
          # The old direct ports still work
          check http://localhost:8080/api/productos 200
          check http://localhost:8081/api/favorites 200

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
