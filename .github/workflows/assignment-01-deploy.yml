# Deploys assignment 01 to the EC2 instance that already exists (progweb-server).
# It does NOT create instances and it does NOT start the instance: it only runs
# when I press "Run workflow" in the Actions tab, so it never spends AWS credits by itself.
# One-time setup: see docs/deployment.md
name: "Assignment 01 · Deploy to EC2"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        default: main
        required: true

# Never run two deployments at the same time
concurrency:
  group: assignment-01-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # only used if the optional AWS role is configured

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: ${{ vars.EC2_APP_DIR || 'web-programming-projects' }}
    steps:
      # Optional: the security group only allows SSH from my home IP. If AWS_ROLE_ARN is set,
      # the workflow opens port 22 just for this GitHub runner and closes it again at the end.
      - name: Configure AWS credentials (optional)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Allow SSH from this runner (optional)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "${{ vars.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "$IP/32"

      - name: Pull the code and restart the containers on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/${{ env.APP_DIR }}"
            git fetch --all --prune
            git checkout "${{ inputs.ref }}"
            git pull --ff-only
            cd assignments/01-product-catalog
            test -f .env || { echo "Missing .env next to docker-compose.yml"; exit 1; }
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker compose ps

      - name: Close SSH for this runner again (optional)
        if: ${{ always() && vars.AWS_ROLE_ARN != '' && env.RUNNER_IP != '' }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ vars.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32"
